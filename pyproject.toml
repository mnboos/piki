[project]
name = "pi-ki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiortc>=1.14.0",
    "av>=16.1.0",
    "channels==4.3.2",
    "daphne==4.2.1",
    "django==5.2.11",
    "django-cors-headers==4.9.0",
    "django-ninja==1.4.3",
    "norfair==2.3.0",
    "numpy==1.26.4",
    "opencv-contrib-python-headless==4.11.0.86",
    "rich==14.2.0",
]

[dependency-groups]
dev = [
    "py-spy==0.3.14",
    "ruff==0.14.0",
    "ty==0.0.1a19",
]
model-conversion = []

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
dummy-variable-rgx = "^(request|_)$"

[tool.ruff.lint]
select = ["I", "ALL"]
ignore = [
    "ERA001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D401",
    "FIX002",
    "D107",
    "T201", # print found
    "ANN201",
    "ANN204",
    "TRY003",
    "EM101",
    "EM102",
    "TD003",
    "S101",
    "PLW0603", # Using the global statement to update `double_buffer` is discouraged
    "G004"  # f-string in logging-statement
]
